services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: yangi
    ports:
      - "5432:5432"
    volumes:
      - yangi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yangi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yangi_pg:
